<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tracker Man</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884 wss://test.mosquitto.org:8081 https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Tracker Man – Le cache-cache géant grandeur nature au radar GPS entre amis">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker Man">
  <link rel="icon" type="image/png" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="boot-guard.js"></script>
</head>
<body style="background:#0f1115;margin:0">
  <app-root>
    <!-- Écran de chargement affiché tant qu'Angular n'a pas démarré (remplacé automatiquement au lancement) -->
    <div id="boot-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#c9ced8;font-family:system-ui,-apple-system,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
      <img src="icons/icon-192x192.png" alt="" width="96" height="96" style="border-radius:22px">
      <div style="font-size:15px;opacity:.8">Chargement de Tracker Man…</div>
      <div id="boot-repair" style="display:none;max-width:320px">
        <p style="font-size:14px;line-height:1.4;margin:0 0 14px">Le chargement prend plus de temps que prévu.</p>
        <button id="boot-repair-btn" type="button" style="background:#ff6a2b;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:600">🔄 Réparer et recharger</button>
      </div>
    </div>
  </app-root>
  <noscript>Active JavaScript pour utiliser Tracker Man.</noscript>
</body>
</html>
